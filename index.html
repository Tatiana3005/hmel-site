<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хмель — зелёное золото России</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow-x: hidden;
      color: #fff;
    }

    /* ===== Анимированный фон ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #0f2a0f, #1a3c1a, #2e5c2e, #1a3c1a);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
    }
    @keyframes gradientMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Лёгкие «светлячки» на фоне */
    .fireflies {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,200,0.6), transparent),
        radial-gradient(2px 2px at 70% 60%, rgba(255,255,200,0.5), transparent),
        radial-gradient(2px 2px at 40% 80%, rgba(255,255,200,0.4), transparent),
        radial-gradient(2px 2px at 85% 20%, rgba(255,255,200,0.5), transparent),
        radial-gradient(2px 2px at 10% 70%, rgba(255,255,200,0.4), transparent);
      animation: flicker 4s ease-in-out infinite alternate;
    }
    @keyframes flicker {
      from { opacity: 0.4; }
      to   { opacity: 1; }
    }

    /* ===== Экраны ===== */
    .screen {
      min-height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 0.8s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Главный экран ===== */
    #screen-main h1 {
      font-size: 52px;
      margin: 0 0 20px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 20px;
      opacity: 0.85;
      max-width: 700px;
      margin-bottom: 50px;
      line-height: 1.5;
    }
    .buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 16px 42px;
      font-size: 18px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .btn-contacts {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.7);
    }
    .btn-contacts:hover {
      background: #fff;
      color: #1a3c1a;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .btn-more {
      background: linear-gradient(135deg, #8bc34a, #558b2f);
      color: #fff;
      box-shadow: 0 6px 20px rgba(124,179,66,0.4);
    }
    .btn-more:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 30px rgba(124,179,66,0.6);
    }

    /* ===== Экран выбора персонажа ===== */
    #screen-characters h2 {
      font-size: 40px;
      margin-bottom: 60px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .characters {
      display: flex;
      gap: 100px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .character {
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      position: relative;
    }
    /* Плавное покачивание */
    .character img {
      width: 260px;
      height: 260px;
      object-fit: contain;
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      padding: 16px;
      backdrop-filter: blur(4px);
      transition: all 0.4s;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.4));
    }
    .character:nth-child(2) img { animation-delay: 1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    .character:hover { transform: scale(1.08); }
    .character:hover img {
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 40px rgba(139,195,74,0.6);
    }
    .character p {
      font-size: 24px;
      margin-top: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ===== Экран контактов ===== */
    #contacts h2 {
      font-size: 40px;
      margin-bottom: 30px;
    }
    #contacts p {
      font-size: 20px;
      margin: 10px 0;
      opacity: 0.9;
    }
    .back-btn {
      margin-top: 40px;
      padding: 14px 36px;
      font-size: 16px;
      border-radius: 50px;
      border: 2px solid #fff;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
      font-weight: 600;
    }
    .back-btn:hover {
      background: #fff;
      color: #1a3c1a;
    }

    /* ===== Адаптив под телефон ===== */
    @media (max-width: 600px) {
      #screen-main h1 { font-size: 32px; }
      .subtitle { font-size: 16px; }
      #screen-characters h2 { font-size: 26px; margin-bottom: 30px; }
      .characters { gap: 40px; }
      .character img { width: 160px; height: 160px; }
      .character p { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- Анимированный фон -->
  <div class="bg"></div>
  <div class="fireflies"></div>

  <!-- ЭКРАН 1: Главный -->
  <div id="screen-main" class="screen active">
    <h1>Хмель — зелёное золото России</h1>
    <p class="subtitle">Интерактивная карта терруаров по возделыванию хмеля и производству сырья</p>
    <div class="buttons">
      <button class="btn btn-contacts" onclick="showScreen('contacts')">Контакты</button>
      <button class="btn btn-more" onclick="showScreen('screen-characters')">Узнать больше</button>
    </div>
  </div>

  <!-- ЭКРАН 2: Выбор персонажа -->
  <div id="screen-characters" class="screen">
    <h2>С кем хочешь отправиться в путешествие?</h2>
    <div class="characters">
      <div class="character" onclick="chooseCharacter('boy')">
        <img src="boy.png" alt="Мальчик">
        <p>Мальчик</p>
      </div>
      <div class="character" onclick="chooseCharacter('girl')">
        <img src="girl.png" alt="Девочка">
        <p>Девочка</p>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 3: Контакты -->
  <div id="contacts" class="screen">
    <h2>Контакты</h2>
    <p>Email: example@mail.ru</p>
    <p>Телефон: +7 (999) 123-45-67</p>
    <button class="back-btn" onclick="showScreen('screen-main')">Назад</button>
  </div>

  <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    function chooseCharacter(who) {
      window.location.href = 'https://fr0undi.github.io/Interactive_Map/?character=' + who;
    }
  </script>

</body>
</html>
